name: Generate Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Pillow
        run: pip install pillow

      - name: Dessiner les icônes
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw

          def make(size):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)

              d.rounded_rectangle(
                  [0, 0, size - 1, size - 1],
                  radius=size // 6,
                  fill=(17, 17, 17, 255)
              )

              gold = (212, 175, 55, 255)
              w = max(2, size // 32)
              cx = size // 2

              d.line([cx, size * 0.18, cx, size * 0.80], fill=gold, width=w)
              d.line([size * 0.32, size * 0.80, size * 0.68, size * 0.80], fill=gold, width=w)
              d.line([size * 0.20, size * 0.26, size * 0.80, size * 0.26], fill=gold, width=w)

              d.line([size * 0.20, size * 0.26, size * 0.12, size * 0.50], fill=gold, width=w)
              d.line([size * 0.20, size * 0.26, size * 0.28, size * 0.50], fill=gold, width=w)
              d.pieslice([size * 0.10, size * 0.50, size * 0.30, size * 0.62], 0, 180, fill=gold)

              d.line([size * 0.80, size * 0.26, size * 0.72, size * 0.50], fill=gold, width=w)
              d.line([size * 0.80, size * 0.26, size * 0.88, size * 0.50], fill=gold, width=w)
              d.pieslice([size * 0.70, size * 0.50, size * 0.90, size * 0.62], 0, 180, fill=gold)

              d.ellipse(
                  [cx - size * 0.04, size * 0.14, cx + size * 0.04, size * 0.22],
                  fill=gold
              )

              return img.convert("RGB")

          make(192).save("frontend/icon-192.png")
          make(512).save("frontend/icon-512.png")
          print("ICONS_OK")
          PY

      - name: Committer les icônes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add frontend/icon-192.png frontend/icon-512.png
          git commit -m "Generate PNG icons" || echo "nothing to commit"
          git push
